<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kickboard Guard</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.2rem; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .status { font-size: 1.4rem; font-weight: bold; text-align: center; padding: 16px; border-radius: 12px; }
  .near { background: #2e7d3233; } .far { background: #c6282833; } .idle { background: #8882; }
  label { display: block; margin: 8px 0 2px; font-size: .9rem; }
  input, select, button { width: 100%; padding: 8px; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 8px; }
  #log { font-family: monospace; font-size: .8rem; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  #banner { display: none; margin-bottom: 12px; padding: 14px; border-radius: 12px; background: #e65100; color: #fff; font-weight: bold; }
  #banner button { background: #fff; color: #e65100; border: 0; border-radius: 8px; }
  .row { display: flex; justify-content: space-between; }
  .hint { font-size: .8rem; opacity: .8; margin: 4px 0; }
</style>
</head>
<body>
<h1>🛴 Kickboard Guard</h1>

<div id="banner"><span id="bannerText"></span><button id="bannerClose">閉じる</button></div>
<div id="status" class="status idle">停止中</div>

<div class="card">
  <div class="row"><span>距離</span><b id="dist">-</b></div>
  <div class="row"><span>スマホ精度</span><span id="accPhone">-</span></div>
  <div class="row"><span>キックボード最終受信</span><span id="kickAge">-</span></div>
  <div class="row"><span>Bluetooth</span><span id="bleState">未接続</span></div>
</div>

<div class="card">
  <label>キックボード位置の取得方法</label>
  <select id="mode">
    <option value="ble">ESP32-C3（Bluetooth）</option>
    <option value="demo">デモ（スマホ位置からずらして擬似生成）</option>
    <option value="api">サーバAPIから取得</option>
  </select>

  <div id="bleBox">
    <button id="bleBtn" type="button">ESP32-C3に接続</button>
    <div class="hint">Android: Chrome ／ iPhone: Bluefy アプリで開いてください（iPhoneのSafariは非対応）。接続後に「監視開始」を押します。</div>
  </div>

  <div id="demoBox" hidden>
    <label>デモ用: キックボードとの距離 <b id="demoVal">5</b> m</label>
    <input id="demoDist" type="range" min="0" max="100" value="5">
  </div>

  <div id="apiBox" hidden>
    <label>位置取得URL（{lat, lng, accuracy?, timestamp?} のJSONを返すもの）</label>
    <input id="apiUrl" type="url" placeholder="https://example.com/api/kickboard/position">
  </div>

  <label>離れたと判定する距離（m）</label>
  <input id="threshold" type="number" value="30" min="5">
  <label>連続何回超えたら判定するか（誤検知防止）</label>
  <input id="needCount" type="number" value="3" min="1">
  <label>再通知の間隔（分・0で1回だけ）</label>
  <input id="repeatMin" type="number" value="3" min="0">

  <label>返却場所（ここにキックボードがあれば通知しません）</label>
  <div class="row" style="gap:8px">
    <input id="retLat" type="number" step="any" placeholder="緯度">
    <input id="retLng" type="number" step="any" placeholder="経度">
    <input id="retRad" type="number" value="20" title="半径(m)" style="max-width:90px">
  </div>
  <button id="setReturnBtn" type="button">スマホの現在地を返却場所に設定</button>

  <button id="testBtn" type="button">通知テスト</button>

  <label>ロック等を実行するURL（任意・POSTされます）</label>
  <input id="lockUrl" type="url" placeholder="https://example.com/api/kickboard/lock">

  <button id="startBtn">監視開始</button>
</div>

<div class="card"><div id="log"></div></div>

<script>
// ====== 設定・状態 ======
const $ = id => document.getElementById(id);
let phone = null;          // {lat, lng, accuracy}
let kick = null;           // {lat, lng, accuracy, timestamp}
let state = "idle";        // idle | near | far
let overCount = 0;
let watchId = null, pollTimer = null, tickTimer = null;
let lastNotifyAt = 0;
let audioCtx = null, wakeLock = null;
const REMINDER_MESSAGE = "電動キックボードを返し忘れていませんか？";  // 変更する場合はここ（画面からは変更不可）
const HYSTERESIS = 0.8;    // 復帰は閾値の80%以下になったとき（境界でのバタつき防止）
const STALE_MS = 15000;    // キックボードのデータがこれより古いと警告

// ====== ユーティリティ ======
function log(msg) {
  const t = new Date().toLocaleTimeString();
  $("log").textContent = `[${t}] ${msg}\n` + $("log").textContent;
}

// 2点間距離（ハバーシン公式, メートル）
function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// 緯度方向にmeterだけずらした点（デモ用）
function offsetNorth(p, meter) {
  return { lat: p.lat + meter / 111320, lng: p.lng, accuracy: 5, timestamp: Date.now() };
}

// ====== BLE（ESP32-C3） ======
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_UUID    = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
let bleDevice = null, bleRetry = 0, bleUserStop = false;

async function connectBle() {
  if (!navigator.bluetooth) {
    return log("このブラウザはBluetooth非対応です。Android→Chrome、iPhone→Bluefyで開いてください");
  }
  try {
    bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
    bleDevice.addEventListener("gattserverdisconnected", onBleDisconnected);
    bleUserStop = false; bleRetry = 0;
    await openGatt();
  } catch (e) { log("BLE接続失敗: " + e.message); }
}

async function openGatt() {
  const server = await bleDevice.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  const ch = await service.getCharacteristic(CHAR_UUID);
  ch.addEventListener("characteristicvaluechanged", onBleData);
  await ch.startNotifications();
  $("bleState").textContent = "接続中: " + (bleDevice.name || "");
  log("BLE接続しました: " + bleDevice.name);
}

// 切断されたら数回だけ自動で再接続を試みる
function onBleDisconnected() {
  $("bleState").textContent = "切断";
  log("BLE切断されました");
  if (bleUserStop || bleRetry >= 10) return;
  bleRetry++;
  setTimeout(async () => {
    try { await openGatt(); bleRetry = 0; }
    catch (e) { log(`再接続失敗(${bleRetry}/10): ` + e.message); onBleDisconnected(); }
  }, 3000);
}

// 受信データ "緯度,経度,精度" または "NOFIX"（GPS未測位）
function onBleData(ev) {
  const text = new TextDecoder().decode(ev.target.value).trim();
  if (text.startsWith("NOFIX")) { kick = null; $("kickAge").textContent = "GPS未測位"; return; }
  const [lat, lng, acc] = text.split(",").map(Number);
  if ([lat, lng].some(isNaN)) return;
  kick = { lat, lng, accuracy: acc || 10, timestamp: Date.now() };
}

// ====== 「離れた」ときに実行する処理（ここを自由に改造） ======
async function onSeparated(dist) {
  log(`⚠ 離れました: ${dist.toFixed(1)} m`);
  notifyReminder(dist);
  const url = $("lockUrl").value;
  if (url) {
    try {
      await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ event: "separated", distance: dist, phone, kick, at: Date.now() }) });
      log("ロック要求を送信しました");
    } catch (e) { log("ロック要求に失敗: " + e.message); }
  }
}

// 「返し忘れていませんか」通知（端末通知 + 画面バナー + バイブ + 音）
function notifyReminder(dist) {
  lastNotifyAt = Date.now();
  const msg = REMINDER_MESSAGE;
  const detail = dist != null ? `（${dist.toFixed(0)} m 離れています）` : "";
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);  // iPhoneは非対応
  beep();
  $("bannerText").textContent = "🛴 " + msg + " " + detail;
  $("banner").style.display = "block";
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("電動キックボード", { body: msg + detail, tag: "kickboard-return", renotify: true });
    } catch (e) { log("端末通知を表示できません（画面バナーのみ）: " + e.message); }
  }
  log("通知: " + msg);
}

function inReturnZone(p) {
  const lat = parseFloat($("retLat").value), lng = parseFloat($("retLng").value);
  if (isNaN(lat) || isNaN(lng)) return false;
  return haversine({ lat, lng }, p) <= (Number($("retRad").value) || 20);
}

function onReunited(dist) {
  $("banner").style.display = "none";
  log(`✓ 近づきました: ${dist.toFixed(1)} m`);
}

// iPhoneではタップ操作の中で作ったAudioContextでないと鳴らないため、ボタン操作時に1回だけ作って使い回す
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch {}
}

function beep() {
  try {
    unlockAudio();
    const osc = audioCtx.createOscillator();
    osc.frequency.value = 880; osc.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.6);
  } catch {}
}

// ====== 位置取得 ======
function startPhoneGps() {
  watchId = navigator.geolocation.watchPosition(
    pos => {
      phone = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      $("accPhone").textContent = `±${pos.coords.accuracy.toFixed(0)} m`;
    },
    err => log("スマホGPSエラー: " + err.message),
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

async function fetchKick() {
  const mode = $("mode").value;
  if (mode === "ble") return;   // BLEは受信時に kick が更新される
  if (mode === "demo") {
    if (phone) kick = offsetNorth(phone, Number($("demoDist").value));
    return;
  }
  try {
    const res = await fetch($("apiUrl").value, { cache: "no-store" });
    const j = await res.json();
    kick = { lat: j.lat, lng: j.lng, accuracy: j.accuracy ?? 10, timestamp: j.timestamp ?? Date.now() };
  } catch (e) { log("キックボード位置の取得失敗: " + e.message); }
}

// ====== 判定ループ ======
function evaluate() {
  if (!phone || !kick) { setStatus("idle", "位置情報待ち…"); return; }

  const age = Date.now() - kick.timestamp;
  $("kickAge").textContent = (age / 1000).toFixed(0) + " 秒前";
  if (age > STALE_MS) { setStatus("idle", "キックボードの信号が古い"); return; }

  const d = haversine(phone, kick);
  $("dist").textContent = d.toFixed(1) + " m";
  const th = Number($("threshold").value);
  const need = Number($("needCount").value);

  // 返却場所にあるなら「返却済み」として通知しない
  if (inReturnZone(kick)) {
    if (state === "far") onReunited(d);
    overCount = 0;
    setStatus("near", "返却場所にあります ✓");
    return;
  }

  if (state !== "far") {
    overCount = d > th ? overCount + 1 : 0;
    if (overCount >= need) { setStatus("far", `離れています（${d.toFixed(0)} m）`); onSeparated(d); }
    else setStatus("near", `近くにあります（${d.toFixed(0)} m）`);
  } else if (d < th * HYSTERESIS) {
    overCount = 0;
    setStatus("near", `近くにあります（${d.toFixed(0)} m）`);
    onReunited(d);
  } else {
    // まだ離れたまま → 一定間隔で再通知
    const every = Number($("repeatMin").value) * 60000;
    if (every > 0 && Date.now() - lastNotifyAt >= every) notifyReminder(d);
  }
}

function setStatus(s, text) {
  state = s;
  $("status").className = "status " + s;
  $("status").textContent = text;
}

// ====== UI ======
$("mode").onchange = () => {
  const m = $("mode").value;
  $("bleBox").hidden  = m !== "ble";
  $("demoBox").hidden = m !== "demo";
  $("apiBox").hidden  = m !== "api";
};
$("demoDist").oninput = () => $("demoVal").textContent = $("demoDist").value;
$("bleBtn").onclick = connectBle;
$("bannerClose").onclick = () => $("banner").style.display = "none";

$("testBtn").onclick = async () => {
  unlockAudio();
  if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
  notifyReminder(null);
};

$("setReturnBtn").onclick = () => {
  if (!phone) return log("先に「監視開始」を押してGPSを取得してください");
  $("retLat").value = phone.lat.toFixed(6);
  $("retLng").value = phone.lng.toFixed(6);
  log("返却場所を現在地に設定しました");
};

$("startBtn").onclick = async () => {
  if (watchId !== null) {   // 停止
    navigator.geolocation.clearWatch(watchId);
    clearInterval(pollTimer); clearInterval(tickTimer);
    if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
    watchId = null; phone = kick = null; overCount = 0;
    setStatus("idle", "停止中"); $("startBtn").textContent = "監視開始";
    return;
  }
  if (!("geolocation" in navigator)) return log("このブラウザはGPS非対応です");
  unlockAudio();
  if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission();
  // 画面が消えると監視が止まるため、画面を点けたままにする（対応ブラウザのみ）
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch { log("画面の常時点灯は使えません。画面を消さないでください"); }
  startPhoneGps();
  pollTimer = setInterval(fetchKick, 3000);
  tickTimer = setInterval(evaluate, 1000);
  $("startBtn").textContent = "監視停止";
  log("監視を開始しました");
};
</script>
</body>
</html>
